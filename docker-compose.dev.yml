# Dev stack with hot reload. Edit files on the host; no rebuilds needed.
#   docker compose -f docker-compose.dev.yml up --build
# Frontend: http://localhost:5173 (Vite HMR)   Backend: http://localhost:8000 (uvicorn --reload)
# Rebuild only when package.json / requirements.txt change.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./puzzles.db
      - CORS_ORIGINS=http://localhost:5173
      # Bind mounts on Windows/macOS don't deliver file events reliably.
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_USE_POLLING=true
    volumes:
      - ./frontend:/app
      # Keep the container's installed deps; don't let the host folder hide them.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
